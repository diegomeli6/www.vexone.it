<script>
/* ============ SHARED HELPERS ============ */
const fmt=n=>'€ '+n.toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt0=n=>(n<0?'− € ':'€ ')+Math.abs(Math.round(n)).toLocaleString('it-IT');
let tT;
function toast(m){const t=document.getElementById('toast');document.getElementById('toast-msg').textContent=m;t.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),2600)}

/* ============ ROUTER ============ */
const VIEWS={}; // riempito dai moduli
const CRUMBS={dash:'Dashboard',ship:'Spedizioni',clients:'Clienti',invoices:'Fatture & Incassi',wallet:'Transazioni & Wallet',prezzi:'Prezzi'};
let currentView='dash';

function go(view){
 currentView=view;
 document.querySelectorAll('.nlink').forEach(b=>b.classList.toggle('on', b.dataset.view===view));
 document.getElementById('crumb').textContent=CRUMBS[view]||'';
 const c=document.getElementById('content');
 c.innerHTML=VIEWS[view] ? VIEWS[view]() : '<p>Sezione in arrivo</p>';
 if(INIT[view]) INIT[view]();
 document.getElementById('sidebar').classList.remove('open');
 window.scrollTo(0,0);
 document.querySelector('.main').scrollTo(0,0);
}
const INIT={}; // init per-view dopo il render

document.getElementById('nav').addEventListener('click',e=>{
 const btn=e.target.closest('.nlink'); if(!btn) return;
 go(btn.dataset.view);
});
</script>

<script>
/* ============ VIEW: CLIENTI (lista + dettaglio 360) ============ */
let clientView='list', currentClient=null;
VIEWS.clients=()=> clientView==='list' ? clientsListHTML() : clientDetailHTML(currentClient);

function clientsListHTML(){
 return `
 <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px">
 <div><h1 class="page">Clienti</h1><p class="psub">Gestisci profili, prezzi e margini dei clienti</p></div>

 </div>
 <div class="kgrid" style="margin-bottom:18px">
 <div class="kbox dark"><div class="kk" style="color:rgba(255,255,255,.5)">Margine totale /mese</div><div class="kv" style="color:var(--lime)">€ 1.711</div></div>
 <div class="kbox"><div class="kk">Clienti attivi</div><div class="kv">6</div></div>
 <div class="kbox"><div class="kk">Markup medio</div><div class="kv" style="color:var(--blue)">+20%</div></div>
 <div class="kbox"><div class="kk">Spedizioni /mese</div><div class="kv">273</div></div>
 </div>
 <div class="card" style="overflow:hidden">
 <div style="padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap">
 <input class="srch" id="cli-search" placeholder=" Cerca cliente, email..." oninput="renderClientsList()">
 <button class="btn btn-ghost btn-sm" onclick="toast('Export CSV')">Esporta CSV</button>
 </div>
 <div style="overflow-x:auto"><table class="tbl">
 <thead><tr><th>Cliente</th><th>Piano</th><th>Spediz.</th><th>Markup</th><th>Wallet</th><th>Margine /mese</th><th></th></tr></thead>
 <tbody id="cli-list-body"></tbody>
 </table></div>
 </div>`;
}
INIT.clients=()=>{ if(clientView==='list') renderClientsList(); else INIT_clientDetail(); };

function renderClientsList(){
 const q=(document.getElementById('cli-search')?.value||'').toLowerCase().trim();
 const list=CLIENTS.filter(c=>c.name.toLowerCase().includes(q)||c.email.toLowerCase().includes(q));
 const body=document.getElementById('cli-list-body');
 if(!body) return;
 body.innerHTML=list.map(c=>{
 const wColor=c.wallet>0?'var(--green)':(c.wallet<0?'var(--red)':'var(--mute)');
 const planChip=c.plan==='Premium'?'<span class="chip chip-dark">Premium</span>':'<span class="chip chip-gray">Standard</span>';
 return `<tr class="clk" onclick="openClient('${c.id}')">
 <td><span style="display:inline-flex;align-items:center;gap:10px"><span class="av" style="background:${c.col};width:30px;height:30px;font-size:10px">${c.ini}</span><span><span style="font-weight:700;">${c.name}</span><br><span style="font-size:10px;color:var(--mute);font-weight:600">${c.email}</span></span></span></td>
 <td>${planChip}</td>
 <td style="font-weight:700;">${c.ship}</td>
 <td><span class="chip chip-blue">+${c.markup}%</span></td>
 <td style="font-weight:700;color:${wColor}">${fmt0(c.wallet)}</td>
 <td style="font-weight:700;color:var(--green)">${fmt0(c.margin)}</td>
 <td style="text-align:right"><button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();openClient('${c.id}')">Apri</button></td>
 </tr>`;
 }).join('');
}
function openClient(id){ currentClient=id; clientView='detail'; go('clients'); }
function backToClients(){ clientView='list'; go('clients'); }

function clientDetailHTML(id){
 const c=CLIENTS.find(x=>x.id===id)||CLIENTS[1];
 const wColor=c.wallet>0?'var(--green)':(c.wallet<0?'var(--red)':'var(--mute)');

 return `
 <button class="btn btn-ghost btn-sm" onclick="backToClients()" style="margin-bottom:16px">← Tutti i clienti</button>
 <div class="card" style="padding:24px 26px;margin-bottom:18px">
 <div style="display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap">
 <div class="av" style="background:${c.col};width:60px;height:60px;font-size:21px;border-radius:var(--radius-md)">${c.ini}</div>

 ${c.plan==='Premium'?'<span class="chip chip-dark">Premium</span>':'<span class="chip chip-gray">Standard</span>'}

 </div>
 <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:#6B7280;font-weight:600">

 </div>
 </div>
 <div style="display:flex;gap:8px;flex-wrap:wrap">
 <button class="btn btn-lime btn-sm" onclick="toast('Nuovo preventivo')">+ Preventivo</button>
 <button class="btn btn-dark btn-sm" onclick="toast('Nuova spedizione')">+ Spedizione</button>
 <button class="btn btn-ghost btn-sm" onclick="toast('Scrivi al cliente')"> Scrivi</button>
 </div>
 </div>
 <div class="kgrid" style="margin-top:18px">
 <div class="kbox dark"><div class="kk" style="color:rgba(255,255,255,.5)">Margine /mese</div><div class="kv" style="color:var(--lime)">${fmt0(c.margin)}</div></div>
 <div class="kbox"><div class="kk">Wallet</div><div class="kv" style="color:${wColor}">${fmt0(c.wallet)}</div>${c.fido>0?'<div class="ks" style="color:var(--amber)">fido '+fmt0(c.fido)+'</div>':''}</div>
 <div class="kbox"><div class="kk">Ricarico medio</div><div class="kv" style="color:var(--blue)">~${ricMedio}%</div></div>
 <div class="kbox"><div class="kk">Salute</div><div class="kv" style="color:var(--green);font-size:17px;margin-top:9px">Sano </div></div>

 </div>

 <div style="display:grid;grid-template-columns:1fr;gap:18px">

 <button class="tab on" data-t="ship"> Spedizioni</button>
 <button class="tab" data-t="inv"> Fatture</button>
 <button class="tab" data-t="price"> Prezzi</button>

 <div id="cd-content"></div>
 </div>
 </div>`;
}
function INIT_clientDetail(){

 }).join('')}</tbody></table></div></div></div>`;
 }).join('');

function markOutPaid(n){const r=OUT_INV.find(x=>x.n===n);if(r){r.stato='pagata';renderInvTab();toast(' '+n+' pagata');}}

function simulatorHTML(){ return `

 <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">

 </div>
 </div>
 </div>
 <div id="sim-result"></div>
 </div>
`; }
function initSimulator(){ runSim(); }
function bandForKg(kg){
 // mappa peso → fascia (limiti coerenti con BANDS)
 const limits=[2,5,10,30,50,100,Infinity];
 for(let i=0;i<limits.length;i++){ if(kg<=limits[i]) return i; }
 return BANDS.length-1;
}
function runSim(){
 const cli=CLIENTS.find(c=>c.id===document.getElementById('sim-cli').value)||CLIENTS[0];
 const kg=parseFloat((document.getElementById('sim-kg').value||'').replace(',','.'))||0;
 const cost=parseFloat((document.getElementById('sim-cost').value||'').replace(',','.'))||0;
 const host=document.getElementById('sim-result'); if(!host) return;

 // calcolo i tre livelli
 const bi=bandForKg(kg);
 const band=BANDS[bi];
 const globalPct=22; // markup globale di default demo
 const clientOverride = cli.markup!==18 ? cli.markup : null; // demo: 18 = "segue globale"

 // determino il vincitore: cliente > fascia > globale
 let winner, winPct, winReason, winLevel;
 if(clientOverride!=null){ winner='cliente'; winPct=clientOverride; winLevel=1; winReason='Questo cliente ha un override personale, che batte fascia e globale.'; }
 else if(band){ winner='fascia'; winPct=band.mk; winLevel=2; winReason='Il pacco da '+kg+' kg rientra nella fascia "'+band.name+'", che batte il globale.'; }
 else { winner='globale'; winPct=globalPct; winLevel=3; winReason='Nessuna fascia applicabile: si usa il markup globale di riserva.'; }

 let margin=cost*winPct/100, floored=false;
 if(margin<PFLOOR){ margin=PFLOOR; floored=true; }
 const final=cost+margin;

 // righe dei tre livelli con stato vince/scartato
 const levels=[
 {n:1,key:'cliente',label:'Override cliente',val: clientOverride!=null?('+'+clientOverride+'%'):'nessuno', active: clientOverride!=null, color:'#7c3aed'},
 {n:2,key:'fascia',label:'Fascia '+(band?band.name:'—'),val: band?('+'+band.mk+'%'):'—', active: !!band, color:'#0078FF'},
 {n:3,key:'globale',label:'Markup globale',val:'+'+globalPct+'%', active:true, color:'#6B7280'},
 ];
 const rows=levels.map(l=>{
 const isWin=l.key===winner;
 const isSkipped = (l.n<winLevel) ? false : (l.n>winLevel ? true : false); // sopra il vincitore: non applicabile; sotto: scartato
 let badge, opacity;
 if(isWin){ badge='<span class="chip chip-green"> VINCE</span>'; opacity='1'; }
 else if(l.n<winLevel){ badge='<span class="chip chip-gray">non impostato</span>'; opacity='.5'; }
 else { badge='<span class="chip chip-gray" style="text-decoration:line-through">scartato</span>'; opacity='.5'; }
 return `<div style="display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);opacity:${opacity}">

 <div style="flex:1"><span style="font-weight:700;font-size:12px">${l.label}</span></div>
 <span style="font-weight:700;font-size:13px;color:${isWin?l.color:'var(--mute)'}">${l.val}</span>
 ${badge}
 </div>`;
 }).join('');

 host.innerHTML=`
 <div class="card" style="overflow:hidden">
 <div style="padding:16px 20px;border-bottom:1px solid var(--line)"><h3 class="sectitle">Come si decide il prezzo</h3></div>
 ${rows}
 <div style="background:linear-gradient(135deg,#0A0A0B,#16181d);padding:20px;color:#fff">
 <div style="display:flex;gap:10px;align-items:flex-start;margin-bottom:14px">
 <span style="font-size:16px"></span>
 <p style="font-size:12px;font-weight:700;margin:0;line-height:1.5">Vince <strong style="color:var(--lime)">${winner==='cliente'?'l\'override cliente':winner==='fascia'?'la fascia di peso':'il markup globale'}</strong> al <strong style="color:var(--lime)">+${winPct}%</strong>. ${winReason}</p>
 </div>

 <div><div class="lbl" style="color:rgba(255,255,255,.4)">Costo DVA</div><div style="font-size:18px;font-weight:700;">${fmt(cost)}</div></div>
 <div><div class="lbl" style="color:rgba(255,255,255,.4)">+ Margine${floored?' ':''}</div><div style="font-size:18px;font-weight:700;color:var(--lime)">+ ${fmt(margin)}</div></div>
 <div><div class="lbl" style="color:rgba(255,255,255,.4)">Cliente paga</div><div style="font-size:18px;font-weight:700;">${fmt(final)}</div></div>
 </div>
 ${floored?'<p style="font-size:10px;color:#fbbf24;font-weight:700;margin:10px 0 0"> Il margine calcolato era sotto €1,50: applicato il minimo garantito.</p>':''}
 </div>
 </div>`;
}

function globalePanelHTML(){ return `
 <p class="psub" style="margin:-4px 0 18px">Il markup di base, applicato quando una spedizione non rientra in nessuna fascia. È la rete di sicurezza.</p>
 <div style="display:grid;grid-template-columns:1fr;gap:18px" id="pricing-grid">
 <div class="card" style="padding:26px">
 <h3 class="sectitle">Markup globale di default</h3>
 <p class="psub" style="margin-bottom:20px">Si applica a ogni cliente senza override e a ogni spedizione senza fascia.</p>
 <label class="lbl">Percentuale di ricarico sul costo DVA</label>
 <div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">
 <div style="position:relative;width:140px"><input class="inp" id="p-pct" value="22" oninput="pRecalc()" style="font-size:28px;font-weight:700;text-align:center;padding-right:32px"><span style="position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:18px;font-weight:700;color:var(--mute)">%</span></div>
 <div style="flex:1;min-width:200px"><div id="p-pct-msg" style="font-size:10px;font-weight:700;color:var(--green);min-height:13px"> valido</div>
 <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
 <button class="btn btn-ghost btn-sm" onclick="pSetPreset(15)">+15%</button><button class="btn btn-dark btn-sm" onclick="pSetPreset(22)">+22%</button><button class="btn btn-ghost btn-sm" onclick="pSetPreset(30)">+30%</button><button class="btn btn-ghost btn-sm" onclick="pSetPreset(40)">+40%</button>
 </div></div>
 </div>
 <div class="hr"></div>
 <label class="lbl"> Margine minimo garantito (paracadute)</label>
 <p class="psub" style="margin:-2px 0 10px">Il margine sotto cui nessun prezzo può scendere, su tutti i clienti senza eccezione. Protegge dalle perdite sulle spedizioni piccole.</p>
 <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
 <div style="position:relative"><span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:16px;font-weight:700;color:var(--mute)">€</span><input class="inp" id="p-floor" value="1.50" oninput="pFloorEdited()" style="padding-left:28px;width:110px;font-size:18px;font-weight:700;text-align:center"></div>
 <button class="btn btn-green btn-sm" id="p-floor-save" style="opacity:.4;pointer-events:none" onclick="pSaveFloor()">Salva minimo</button>
 <span style="font-size:10px;font-weight:700;color:var(--mute)" id="p-floor-hint">valore attuale</span>
 </div>
 <div class="hr"></div>
 <label class="lbl">Come mostriamo i prezzi</label>
 <div style="display:flex;gap:6px;max-width:400px">

 <button class="btn btn-sm" id="p-gross" onclick="pSetVat('gross')" style="flex:1;padding:11px">IVA inclusa (B2C)</button>
 </div>
 <button class="btn btn-lime" style="width:100%;margin-top:20px;padding:14px" onclick="toast(' Markup globale salvato')"> Salva markup globale</button>
 </div>
 <div>
 <div style="background:linear-gradient(135deg,#0A0A0B,#16181d);border-radius:var(--radius-lg);padding:26px;color:#fff">
 <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px"><span style="font-size:12px;font-weight:600;color:rgba(255,255,255,.75);">Anteprima dal vivo</span><span id="p-state" class="chip chip-green"> sano</span></div>
 <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:18px 12px">
 <div><div class="lbl" style="color:rgba(255,255,255,.4)">Costo DVA</div><div style="font-size:22px;font-weight:700;" id="p-cost">€ 10,00</div></div>
 <div><div class="lbl" style="color:rgba(255,255,255,.4)">+ Markup</div><div style="font-size:22px;font-weight:700;color:var(--lime)" id="p-markup">+ € 2,20</div></div>
 <div><div class="lbl" style="color:rgba(255,255,255,.4)">Cliente paga</div><div style="font-size:22px;font-weight:700;" id="p-final">€ 12,20</div></div>

 </div>
 </div>
 <div class="card" style="padding:20px;margin-top:16px">
 <div style="display:flex;justify-content:space-between;margin-bottom:6px"><label class="lbl" style="margin:0">Costo DVA campione</label><span style="font-size:12px;font-weight:700;color:var(--blue)" id="p-slider-val">€ 10,00</span></div>
 <input type="range" id="p-slider" min="2" max="40" step="0.5" value="10" oninput="pSetSample(this.value)" style="width:100%;accent-color:var(--blue)">
 <p class="psub" style="margin-top:8px">Trascina sui valori bassi per vedere il <strong style="color:var(--amber)">paracadute</strong> in azione.</p>
 </div>
 </div>

function initGlobalePanel(){ pSetVat('net'); pRecalc(); pFloorRefreshHint(); }
function pFloorRefreshHint(){
 const el=document.getElementById('p-floor'); if(!el) return;
 el.value=PFLOOR.toFixed(2);
 const hint=document.getElementById('p-floor-hint');
 if(hint) hint.textContent='attuale: '+fmt(PFLOOR);
}
function pFloorEdited(){
 const el=document.getElementById('p-floor');
 const raw=(el.value||'').trim().replace(',','.');
 const v=parseFloat(raw);
 const hint=document.getElementById('p-floor-hint');
 const save=document.getElementById('p-floor-save');
 el.classList.remove('err','warnf');
 if(raw===''||isNaN(v)||v<0){
 el.classList.add('err');
 hint.innerHTML='<span style="color:var(--red)"> il minimo non può essere negativo o vuoto</span>';
 save.style.opacity=.4; save.style.pointerEvents='none';
 return;
 }
 save.style.opacity=1; save.style.pointerEvents='all';
 if(v===0){ el.classList.add('warnf'); hint.innerHTML='<span style="color:var(--amber)"> a €0 nessuna protezione sulle piccole spedizioni</span>'; }
 else hint.innerHTML='nuovo minimo: '+fmt(v);
}
function pSaveFloor(){
 const raw=(document.getElementById('p-floor').value||'').trim().replace(',','.');
 const v=parseFloat(raw);
 if(isNaN(v)||v<0){ toast(' Inserisci un valore valido (zero o positivo)'); return; }
 PFLOOR=v;
 const save=document.getElementById('p-floor-save');
 save.style.opacity=.4; save.style.pointerEvents='none';
 const bar=document.getElementById('pz-floor-bar'); if(bar) bar.textContent=fmt(v);
 pFloorRefreshHint();
 pRecalc();
 toast(' Margine minimo globale: '+fmt(v)+' (su tutti i clienti senza eccezione)');
}
function pSetPreset(v){document.getElementById('p-pct').value=v;pRecalc();}
function pSetSample(v){pSampleCost=parseFloat(v);document.getElementById('p-slider-val').textContent=fmt(pSampleCost);pRecalc();}
function pSetVat(m){pVatMode=m;const n=document.getElementById('p-net'),g=document.getElementById('p-gross');if(n){n.classList.toggle('btn-dark',m==='net');n.classList.toggle('btn-ghost',m!=='net');}if(g){g.classList.toggle('btn-dark',m==='gross');g.classList.toggle('btn-ghost',m!=='gross');}pRecalc();}
function pRecalc(){
 const el=document.getElementById('p-pct'); if(!el) return;
 const raw=(el.value||'').replace(',','.');const pct=parseFloat(raw);
 const msg=document.getElementById('p-pct-msg');
 el.classList.remove('err','warnf');
 if(raw===''||isNaN(pct)){msg.textContent=' inserisci un numero';msg.style.color='var(--red)';el.classList.add('err');}
 else if(pct<=0){msg.textContent=' markup 0 = nessun guadagno';msg.style.color='var(--red)';el.classList.add('err');}
 else if(pct<5){msg.textContent=' sotto il 5%? forse intendevi '+pct+'0%';msg.style.color='var(--amber)';el.classList.add('warnf');}
 else if(pct>100){msg.textContent=' oltre 100%, sicuro?';msg.style.color='var(--amber)';el.classList.add('warnf');}
 else{msg.textContent=' valido';msg.style.color='var(--green)';}
 const p=isNaN(pct)?0:pct,cost=pSampleCost;
 let markup=cost*p/100,floored=false;
 if(markup<PFLOOR){markup=PFLOOR;floored=true;}
 const finalNet=cost+markup,shown=pVatMode==='gross'?finalNet*1.22:finalNet;
 document.getElementById('p-cost').textContent=fmt(cost);
 document.getElementById('p-markup').textContent='+ '+fmt(markup);
 document.getElementById('p-final').textContent=fmt(shown);
 document.getElementById('p-margin').textContent=fmt(markup);
 const st=document.getElementById('p-state');
 if(markup<=0){st.className='chip chip-red';st.textContent=' in perdita';}
 else if(floored){st.className='chip chip-amber';st.textContent=' salvato dal minimo';}
 else{st.className='chip chip-green';st.textContent=' sano';}
}
</script>
<script>
/* ============ VIEW: FASCE DI PESO ============ */
const BANDS=[
 {name:'0 – 2 kg',desc:'Buste, plichi',cost:4,mk:25,mkt:5.5,scale:7},
 {name:'2 – 5 kg',desc:'Pacchi standard',cost:5,mk:20,mkt:6,scale:7},
 {name:'5 – 10 kg',desc:'Pacchi medi',cost:12,mk:35,mkt:null,scale:22},
 {name:'10 – 30 kg',desc:'Pacchi pesanti',cost:30,mk:50,mkt:60,scale:55},
 {name:'30 – 50 kg',desc:'Molto pesanti',cost:48,mk:65,mkt:110,scale:130},
 {name:'50 – 100 kg',desc:'Voluminosi',cost:80,mk:55,mkt:null,scale:180},
 {name:'100+ kg',desc:'Oltre soglia',cost:140,mk:50,mkt:null,scale:300},
];
let bandsTab='list',palMode='pct';
function fasciePanelHTML(){ return `
 <p class="psub" style="margin:-4px 0 16px">Il tuo vero listino. Se impostate, le fasce hanno la precedenza sul markup globale: ogni spedizione cade in una fascia, quindi il globale resta di riserva.</p>
 <div class="tabs" style="max-width:420px">
 <button class="tab on" id="b-t-list" onclick="setBandsTab('list')"> Listino fasce</button>
 <button class="tab" id="b-t-pallet" onclick="setBandsTab('pallet')"> Pallet a preventivo</button>
 </div>
 <div id="b-content"></div>
`; }
function initFasciePanel(){ renderBandsTab(); }
function setBandsTab(t){bandsTab=t;document.getElementById('b-t-list').classList.toggle('on',t==='list');document.getElementById('b-t-pallet').classList.toggle('on',t==='pallet');renderBandsTab();}
function renderBandsTab(){
 const c=document.getElementById('b-content'); if(!c) return;
 if(bandsTab==='list'){ c.innerHTML=bandsListHTML(); renderBandRows(); }
 else { c.innerHTML=palletHTML(); calcPallet(); }
}
function bandsListHTML(){
 return `<div class="note-box" style="margin-bottom:16px"><span style="font-size:16px"></span><p style="font-size:11.5px;color:#3a4250;font-weight:600;margin:0;line-height:1.5">Queste percentuali le vedi <strong>solo tu</strong>. Il cliente vede solo il prezzo finale. La colonna mercato serve a controllare di non sforare la concorrenza.</p></div>
 <div class="card" style="padding:8px"><div style="overflow-x:auto"><table class="tbl">
 <thead><tr><th>Fascia</th><th style="text-align:center">Markup %</th><th style="text-align:center">Margine</th><th>Tu vendi</th><th>Mercato noto</th></tr></thead>
 <tbody id="band-rows"></tbody>
 </table></div></div>
 <div class="win" style="margin-top:16px"><span style="font-size:16px"></span><p style="font-size:11.5px;color:#14532d;font-weight:700;margin:0;line-height:1.5">La % scende sui piccoli (concorrenza feroce) e sale sui grossi (il cliente si aspetta di pagare tanto e tu lo fai comunque risparmiare). Il margine in € cresce, il prezzo resta competitivo.</p></div>`;
}
function bandCalc(b){let m=b.cost*(parseFloat(b.mk)||0)/100,fl=false;if(m<1.5){m=1.5;fl=true;}return{m,you:b.cost+m,fl};}
function compTag(you,mkt){if(mkt==null||isNaN(mkt)||mkt<=0)return['chip-gray','—'];const s=(mkt-you)/mkt*100;if(you>mkt)return['chip-amber',' sopra (+'+Math.round(you-mkt)+')'];if(s<8)return['chip-amber','stretto'];return['chip-green','sotto del '+s.toFixed(0)+'%'];}
function renderBandRows(){
 const body=document.getElementById('band-rows'); if(!body) return;
 body.innerHTML=BANDS.map((b,i)=>{
 const{m,you,fl}=bandCalc(b);const[ct,cx]=compTag(you,b.mkt);
 return `<tr><td><strong style="">${b.name}</strong><br><span style="font-size:10px;color:var(--mute);font-weight:700">${b.desc}</span></td>
 <td style="text-align:center"><input class="inp" value="${b.mk}" oninput="editBand(${i},this.value)" style="width:64px;text-align:center;font-size:14px;padding:7px"></td>
 <td style="text-align:center"><span style="font-weight:700;color:var(--green)" id="bm-${i}">${fmt(m)}</span>${fl?'<br><span style="font-size:11px;color:var(--amber);font-weight:700"> min</span>':''}</td>
 <td><span style="font-weight:700;" id="by-${i}">${fmt0(you)}</span> <span class="chip ${ct}" id="bc-${i}" style="margin-left:4px">${cx}</span><div style="font-size:11px;color:var(--mute);font-weight:700;margin-top:2px">DVA ${fmt0(b.cost)}</div></td>
 <td><input class="inp" value="${b.mkt!=null?b.mkt:''}" placeholder="se lo sai" oninput="editMkt(${i},this.value)" style="width:110px;font-size:11px;padding:7px"></td>
 </tr>`;
 }).join('');
}
function editBand(i,v){BANDS[i].mk=v;const{m,you}=bandCalc(BANDS[i]);const bm=document.getElementById('bm-'+i),by=document.getElementById('by-'+i);if(bm)bm.textContent=fmt(m);if(by)by.textContent=fmt0(you);refreshComp(i);}
function editMkt(i,v){const s=(''+v).trim().replace(',','.');const n=parseFloat(s);BANDS[i].mkt=(s===''||isNaN(n)||n<=0)?null:n;refreshComp(i);}
function refreshComp(i){const{you}=bandCalc(BANDS[i]);const[ct,cx]=compTag(you,BANDS[i].mkt);const el=document.getElementById('bc-'+i);if(el){el.className='chip '+ct;el.textContent=cx;}}
function palletHTML(){
 return `<div class="callout" style="margin-bottom:16px"><span style="font-size:16px"></span><p style="font-size:11.5px;color:#7c4a06;font-weight:700;margin:0;line-height:1.5"><strong>I pallet non hanno listino fisso.</strong> DVA quota sul momento. Inserisci il costo, vedi il prezzo, lo confermi tu. Spedizioni grosse e poche: una a una, mai alla cieca.</p></div>
 <div class="card" style="padding:26px">
 <h3 class="sectitle" style="margin-bottom:14px">Calcolatore preventivo pallet</h3>
 <div style="background:linear-gradient(135deg,#0A0A0B,#16181d);border-radius:var(--radius-md);padding:22px;color:#fff">
 <div style="display:grid;grid-template-columns:1fr;gap:16px">
 <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
 <div><label class="lbl" style="color:rgba(255,255,255,.5)">Costo DVA quotato (€)</label><input class="inp" id="pal-cost" value="78" oninput="calcPallet()" style="background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.15);color:#fff"></div>
 <div><label class="lbl" style="color:rgba(255,255,255,.5)">Confronto mercato (opz.)</label><input class="inp" id="pal-mkt" placeholder="€ ?" oninput="calcPallet()" style="background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.15);color:#fff"></div>
 </div>
 <div><label class="lbl" style="color:rgba(255,255,255,.5)">Come calcolo il margine</label>
 <div style="display:flex;gap:8px;margin-bottom:10px"><button class="btn btn-sm" id="palm-pct" onclick="setPalMode('pct')" style="flex:1;padding:9px">% Percentuale</button><button class="btn btn-sm" id="palm-fix" onclick="setPalMode('fix')" style="flex:1;padding:9px">€ Margine fisso</button></div>
 <input class="inp" id="pal-mk" value="45" oninput="calcPallet()" placeholder="markup %" style="background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.15);color:#fff">
 <input class="inp" id="pal-fix" placeholder="margine € fisso" oninput="calcPallet()" style="background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.15);color:#fff;display:none">
 </div>
 </div>
 <div style="display:flex;gap:24px;flex-wrap:wrap;align-items:center;margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.1)">
 <div><div class="lbl" style="color:rgba(255,255,255,.4)">Tuo margine</div><div style="font-size:24px;font-weight:700;color:var(--lime)" id="pal-margin">€ 35,10</div></div>
 <div style="font-size:20px;color:rgba(255,255,255,.3)">→</div>
 <div><div class="lbl" style="color:rgba(255,255,255,.4)">Cliente paga</div><div style="font-size:24px;font-weight:700;" id="pal-final">€ 113,10</div></div>
 <span style="font-size:11px;font-weight:700;color:var(--lime);margin-left:auto" id="pal-comp"></span>
 </div>
 <div id="pal-warn" style="margin-top:12px;font-size:11px;font-weight:700;color:#fbbf24;display:none"></div>
 </div>
 <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px"><button class="btn btn-ghost btn-sm" onclick="toast('Preventivo scartato')">Scarta</button><button class="btn btn-dark" onclick="toast(' Preventivo pallet confermato')">Conferma preventivo</button></div>
 </div>`;
}
function setPalMode(m){palMode=m;const p=document.getElementById('palm-pct'),f=document.getElementById('palm-fix');if(p){p.classList.toggle('btn-dark',m==='pct');p.classList.toggle('btn-ghost',m!=='pct');}if(f){f.classList.toggle('btn-dark',m==='fix');f.classList.toggle('btn-ghost',m!=='fix');}document.getElementById('pal-mk').style.display=m==='pct'?'block':'none';document.getElementById('pal-fix').style.display=m==='fix'?'block':'none';calcPallet();}
function calcPallet(){
 const cost=parseFloat((document.getElementById('pal-cost')?.value||'').replace(',','.'))||0;
 let margin=0;
 if(palMode==='fix')margin=parseFloat((document.getElementById('pal-fix').value||'').replace(',','.'))||0;
 else margin=cost*(parseFloat((document.getElementById('pal-mk').value||'').replace(',','.'))||0)/100;
 const final=cost+margin;
 document.getElementById('pal-margin').textContent=fmt(margin);
 document.getElementById('pal-final').textContent=fmt(final);
 const w=document.getElementById('pal-warn');
 if(cost>0&&margin>0&&margin/cost<0.08){w.style.display='block';w.textContent=' Margine sottile: solo '+(margin/cost*100).toFixed(0)+'% del costo.';}
 else if(cost>0&&margin<=0){w.style.display='block';w.textContent=' Margine zero o negativo.';}
 else w.style.display='none';
 const s=(''+(document.getElementById('pal-mkt')?.value||'')).trim().replace(',','.');const mkt=parseFloat(s);const comp=document.getElementById('pal-comp');
 if(s!==''&&!isNaN(mkt)&&mkt>0){if(final>mkt){comp.textContent=' sopra di '+fmt0(final-mkt);comp.style.color='#fbbf24';}else{comp.textContent='cliente risparmia '+fmt0(mkt-final);comp.style.color='var(--lime)';}}else comp.textContent='';
}

/* ============ BOOT ============ */
go('dash');
</script>
